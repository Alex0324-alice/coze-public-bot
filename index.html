<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的智能体</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
      background: #f7f7f8;
    }
    h1 { font-size: 20px; }
    #chat {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      min-height: 360px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .msg {
      margin: 10px 0;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .me { color: #1a73e8; font-weight: bold; }
    .bot { color: #0b7a3b; font-weight: bold; }
    form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { background: #999; }
  </style>
</head>
<body>
  <h1>我的智能体</h1>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="输入你的问题..." autocomplete="off" />
    <button id="send" type="submit">发送</button>
  </form>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    let userId = localStorage.getItem('coze_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).slice(2);
      localStorage.setItem('coze_user_id', userId);
    }

    let conversationId = localStorage.getItem('coze_conversation_id') || '';

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function (m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[m];
      });
    }

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<span class="${role === '你' ? 'me' : 'bot'}">${role}：</span>${escapeHtml(text)}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage('你', text);
      input.value = '';
      sendBtn.disabled = true;
      const loadingDiv = addMessage('智能体', '思考中...');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            userId: userId,
            conversationId: conversationId
          })
        });

        const data = await res.json();

        if (data.conversationId) {
          conversationId = data.conversationId;
          localStorage.setItem('coze_conversation_id', conversationId);
        }

        loadingDiv.innerHTML = `<span class="bot">智能体：</span>${escapeHtml(data.answer || data.error || '没有返回内容')}`;
      } catch (err) {
        loadingDiv.innerHTML = `<span class="bot">智能体：</span>请求失败：${escapeHtml(err.message)}`;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    addMessage('智能体', '你好，我是智能体，请直接输入问题测试。');
  </script>
</body>
</html>
